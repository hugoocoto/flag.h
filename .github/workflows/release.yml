name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make example

      - name: Package
        run: |
          mkdir dist
          make package
          mv flag.h-*.zip dist/
          cp flag.h dist/
          cd dist && sha256sum * >SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(git describe --tags --match 'v*' --always)
          notes="$version, built from $GITHUB_SHA on $(date -u '+%Y-%m-%d %H:%M UTC')."
          git tag -f nightly "$GITHUB_SHA"
          git push -f origin nightly
          if gh release view nightly --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete nightly --repo "$GITHUB_REPOSITORY" --yes 
          fi
          gh release create nightly dist/* --repo "$GITHUB_REPOSITORY" --prerelease --verify-tag \
            --title "Nightly" --notes "$notes"
